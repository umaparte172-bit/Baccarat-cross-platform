name: TRADE247 packages

# Builds the single-file programs for Windows and Apple-silicon macOS. A single-file program contains the Node.js
# binary of the machine that built it, so each package is built on its own operating system.
on:
  push:
    paths: ['trade247/**', 'Start-TRADE247.*', '.github/workflows/trade247.yml']
  pull_request:
    paths: ['trade247/**', 'Start-TRADE247.*', '.github/workflows/trade247.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: trade247

jobs:
  verify:
    name: Typecheck and tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: trade247/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  package:
    name: Package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest, archive: zip }
          - { name: macos-arm64, os: macos-15, archive: tar.gz }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: trade247/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run package
      # Starts the built program and drives it over HTTP (page, replay, Excel report, backtest on worker threads).
      - run: npm run smoke
      - run: node tools/assemble-release.mjs

      - name: Archive (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $dir = Get-ChildItem release -Directory | Where-Object Name -like 'trade247-win-*' | Select-Object -First 1
          Compress-Archive -Path $dir.FullName -DestinationPath "release/$($dir.Name).zip"
          Get-ChildItem release/*.zip

      - name: Archive (macOS)
        if: matrix.archive == 'tar.gz'
        run: |
          dir=$(ls -d release/trade247-macos-*/ | head -n 1)
          name=$(basename "$dir")
          tar -czf "release/$name.tar.gz" -C release "$name"
          ls -l release/*.tar.gz
          # The ad-hoc signature must verify, or Apple Silicon will not run the program.
          codesign --verify --verbose "release/$name/trade247-macos-arm64"

      - uses: actions/upload-artifact@v4
        with:
          name: trade247-${{ matrix.name }}
          path: |
            trade247/release/*.zip
            trade247/release/*.tar.gz
          if-no-files-found: error

  desktop:
    name: Desktop app (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest }
          - { name: macos-arm64, os: macos-15 }
    runs-on: ${{ matrix.os }}
    env:
      # Ad-hoc signing only: no Apple Developer certificate is used or looked for.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: trade247/package-lock.json
      - run: npm ci
      - run: npm run electron:dist

      # Starts the packaged app without a window and drives it: the page, the API, a replay and a backtest on worker threads.
      - name: Smoke test the packaged app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:T247_DATA_DIR = Join-Path $env:RUNNER_TEMP 't247-smoke'
          $smoke = Start-Process -FilePath 'release/desktop/win-unpacked/TRADE247.exe' -ArgumentList '--smoke' -WindowStyle Hidden -Wait -PassThru
          if ($smoke.ExitCode -ne 0) { throw "smoke test failed ($($smoke.ExitCode))" }

      - name: Selenium desktop controls (Windows)
        if: runner.os == 'Windows'
        run: node tools/selenium-desktop.mjs --app release/desktop/win-unpacked/TRADE247.exe

      - name: Smoke test and verify the signature (macOS)
        if: runner.os == 'macOS'
        run: |
          export T247_DATA_DIR="$RUNNER_TEMP/t247-smoke"
          app=release/desktop/mac-arm64/TRADE247.app
          # The ad-hoc signature must verify, or Apple Silicon will not run the app.
          codesign --verify --deep --strict --verbose=2 "$app"
          "$app/Contents/MacOS/TRADE247" --smoke

      - name: Selenium desktop controls (macOS)
        if: runner.os == 'macOS'
        run: node tools/selenium-desktop.mjs --app release/desktop/mac-arm64/TRADE247.app/Contents/MacOS/TRADE247

      # A downloaded copy carries the quarantine flag. Install it the way a client would, without any Apple ID or
      # notarization, and check that the installed copy is clean, signed, and runs (including Selenium's driver finder).
      - name: Install without an Apple ID (simulated download, macOS)
        if: runner.os == 'macOS'
        run: |
          export T247_DATA_DIR="$RUNNER_TEMP/t247-install-smoke"
          dl="$RUNNER_TEMP/download"
          rm -rf "$dl" && mkdir -p "$dl"
          ditto release/desktop/mac-arm64/TRADE247.app "$dl/TRADE247.app"
          cp packaging/macos/Install-TRADE247.command "$dl/"
          xattr -w com.apple.quarantine "0083;$(printf %x $(date +%s));Safari;" "$dl/TRADE247.app"
          xattr -p com.apple.quarantine "$dl/TRADE247.app"
          TRADE247_INSTALL_DIR="$RUNNER_TEMP/Applications" TRADE247_NO_OPEN=1 bash "$dl/Install-TRADE247.command"
          app="$RUNNER_TEMP/Applications/TRADE247.app"
          if xattr -p com.apple.quarantine "$app" 2>/dev/null; then echo "quarantine flag still set"; exit 1; fi
          codesign --verify --deep --strict --verbose=2 "$app"
          "$app/Contents/Resources/app.asar.unpacked/assets/selenium-manager/selenium-manager" --help > /dev/null
          "$app/Contents/MacOS/TRADE247" --smoke
          dmg=$(ls release/desktop/*.dmg | head -n 1)
          mnt=$(hdiutil attach -nobrowse -readonly "$dmg" | awk -F'\t' '/\/Volumes\//{print $NF}' | tail -n 1)
          echo "mounted at $mnt"; ls -la "$mnt"
          test -f "$mnt/Install-TRADE247.command"
          hdiutil detach "$mnt"

      - uses: actions/upload-artifact@v4
        with:
          name: trade247-desktop-${{ matrix.name }}
          path: |
            trade247/release/desktop/*.exe
            trade247/release/desktop/*.dmg
            trade247/release/desktop/*.zip
            trade247/packaging/macos/Install-TRADE247.command
          if-no-files-found: error

  # The one-click start scripts, from a fresh checkout with no node_modules: they must find Node, download the
  # packages, build the desktop app and pass its self-test (server + window), exactly as a user double-clicking them.
  start-scripts:
    name: Start script from source (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest }
          - { name: macos-arm64, os: macos-15 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: No packages installed yet
        shell: bash
        run: test ! -d trade247/node_modules
      - name: Start-TRADE247.bat check (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: call Start-TRADE247.bat check
      - name: Start-TRADE247.command check (macOS)
        if: runner.os == 'macOS'
        run: |
          test -x Start-TRADE247.command
          ./Start-TRADE247.command check
      - name: Second run reuses the installed packages
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then out=$(cmd //c "Start-TRADE247.bat check"); else out=$(./Start-TRADE247.command check); fi
          echo "$out"
          echo "$out" | grep -q "Packages are up to date."
          echo "$out" | grep -q "Check passed."

  # The app on a Mac the way a client gets it: the DMG from the desktop job, marked as downloaded from the internet,
  # installed with Install-TRADE247.command (no Apple ID), opened normally, then used end to end through its server:
  # a replay, the reports, "Open Chrome for the table", and a live (mock) table read through Selenium WebDriver.
  mac-app-check:
    name: macOS app check (Apple silicon)
    needs: desktop
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: trade247/package-lock.json
      - run: npm ci
      - name: Real-browser tests on macOS (must not be skipped)
        env:
          T247_REQUIRE_BROWSER_TESTS: '1'
        run: npx vitest run test/selenium.test.ts test/live.test.ts test/bettor.test.ts
      - uses: actions/download-artifact@v4
        with:
          name: trade247-desktop-macos-arm64
          path: ${{ runner.temp }}/dl
      - name: Install from the downloaded DMG (no Apple ID)
        run: |
          # The artifact keeps the folders it was uploaded from (release/desktop/...).
          dmg=$(find "$RUNNER_TEMP/dl" -name '*.dmg' | head -n 1)
          [ -n "$dmg" ] || { echo "::error::no DMG in the artifact"; find "$RUNNER_TEMP/dl"; exit 1; }
          echo "DMG: $dmg"
          xattr -w com.apple.quarantine "0083;$(printf %x $(date +%s));Safari;" "$dmg"
          mnt=$(hdiutil attach -nobrowse -readonly "$dmg" | awk -F'\t' '/\/Volumes\//{print $NF}' | tail -n 1)
          echo "mounted at $mnt"; ls -la "$mnt"
          echo "quarantine on the copy in the DMG: $(xattr -p com.apple.quarantine "$mnt/TRADE247.app" 2>/dev/null || echo none)"
          TRADE247_NO_OPEN=1 bash "$mnt/Install-TRADE247.command"
          hdiutil detach "$mnt"
          app=/Applications/TRADE247.app
          [ -d "$app" ] || app="$HOME/Applications/TRADE247.app"
          echo "APP=$app" >> "$GITHUB_ENV"
          if xattr -p com.apple.quarantine "$app" 2>/dev/null; then echo "::error::quarantine flag still set"; exit 1; fi
          codesign --verify --deep --strict --verbose=2 "$app"
          echo "::notice title=macOS install::Installed $app from the quarantined DMG; signature verifies, quarantine cleared"
      - name: Open the app normally and wait for its server
        run: |
          open "$APP"
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:8247/; then break; fi
            sleep 1
          done
          pgrep -x TRADE247 > /dev/null || { echo "::error::TRADE247 is not running"; exit 1; }
          curl -fsS http://127.0.0.1:8247/ | grep -q TRADE247
          echo "::notice title=macOS launch::TRADE247 opened with open(1); window and server at http://127.0.0.1:8247 are up"
      - name: Use the app end to end (replay, reports, Chrome, live table via Selenium)
        run: npx tsx tools/app-check.ts --driver selenium
      - name: Screenshot
        if: always()
        run: screencapture -x "$RUNNER_TEMP/trade247-macos.png" || true
      - name: Quit the app cleanly
        if: always()
        run: |
          osascript -e 'quit app "TRADE247"' || true
          for i in $(seq 1 30); do pgrep -x TRADE247 > /dev/null || break; sleep 1; done
          if pgrep -x TRADE247 > /dev/null; then echo "::error::TRADE247 did not quit"; exit 1; fi
          if curl -fsS -o /dev/null http://127.0.0.1:8247/ 2>/dev/null; then echo "::error::server still answering after quit"; exit 1; fi
          echo "::notice title=macOS quit::TRADE247 quit and its server stopped"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trade247-macos-screenshot
          path: ${{ runner.temp }}/trade247-macos.png
          if-no-files-found: warn
